name: Build Desktop Installers (Windows, macOS, Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (.exe)
            os: windows-latest
            flag: --win
          - name: macOS (.dmg / .zip)
            os: macos-latest
            flag: --mac
          - name: Linux (.deb / .AppImage)
            os: ubuntu-latest
            flag: --linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install web dependencies
        run: npm install

      - name: Install Electron & electron-builder
        run: npm install --no-save electron@35.1.5 electron-builder@25.1.8

      - name: Build Electron web bundle
        run: npm run build:electron

      - name: Package native installer (${{ matrix.name }})
        run: npx electron-builder --config electron-builder.yml ${{ matrix.flag }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comic4Life-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/*.AppImage
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
